name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Unit tests · Docs · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint, package types, i18n check + scan, UI ratchet — lint-ratchet.json)
        run: npm run lint
      - name: Typecheck the web app
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Docs are generated from this code
        run: node scripts/generate-docs.mjs --check
      - name: Universal links / App Links (krizaka/.github#81) — web routes ↔ claimed paths ↔ routes.json
        run: node scripts/check-app-links.mjs
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      # `npm run build` above built the landing (apps/site, a static export) and copied it into apps/web/public (served by the web service).
      - name: SEO family contract (robots, AI crawlers, sitemap, llms.txt, canonical, JSON-LD back to Krizaka)
        run: |
          python3 -m http.server 3000 --directory apps/web/public >/dev/null 2>&1 &
          sleep 2
          node scripts/check-seo-family.mjs --base http://localhost:3000 --host https://dev.yasakia.com --types WebSite,SoftwareApplication
          # Responsive guard: no horizontal overflow at 360–1440 px in both themes, on the landing and the pages it links.
          npx playwright-core install --with-deps chromium
          npm run check:overflow -- --base http://localhost:3000

  database:
    name: Migrations & seed on PostgreSQL 16 + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yasakia_user
          POSTGRES_PASSWORD: yasakia_secret
          POSTGRES_DB: yasakia_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://yasakia_user:yasakia_secret@localhost:5432/yasakia_db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundled production migrator (creates vector, cube, earthdistance, then the schema)
        run: |
          npm run build:migrator -w packages/db
          DATABASE_MIGRATIONS_DIR=packages/db/drizzle node packages/db/dist/migrate.cjs
      - name: Migrations are idempotent
        run: DATABASE_MIGRATIONS_DIR=packages/db/drizzle node packages/db/dist/migrate.cjs
      - name: Development seed loads (twice — idempotent)
        run: npm run db:seed && npm run db:seed

  e2e:
    name: Feature scenarios (API, real sessions, PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yasakia_user
          POSTGRES_PASSWORD: yasakia_secret
          POSTGRES_DB: yasakia_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      # The realtime bus's Redis adapter is checked against a real server (REALTIME_BUS=redis when instances multiply).
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://yasakia_user:yasakia_secret@localhost:5432/yasakia_db
      # The scenarios' settings (e2e/run.mjs E2E_ENV) — test values, no real secret anywhere.
      AUTH_SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
      DATABASE_ENCRYPTION_KEY: Y2ktb25seS1kYXRhLWVuY3J5cHRpb24ta2V5LTMyYnk=
      MAIL_DELIVERY: file
      MAIL_OUTBOX_DIR: ${{ github.workspace }}/.mail-outbox
      MEDIA_STORAGE_PROVIDER: local
      APP_PHOTO_FACE_COMPARISON: "on"
      MEDIA_STORAGE_LOCAL_DIR: ${{ github.workspace }}/.storage
      OPERATOR_API_TOKEN: e2e-only-operator-token-0123456789abcdef0123
      OPERATOR_ALLOWED_IPS: 203.0.113.7
      APP_ACCOUNT_PURGE_INTERVAL_SECONDS: "1"
      APP_SWEEP_INTERVAL_SECONDS: "5"
      APP_MEDIA_REVIEW_INTERVAL_SECONDS: "5"
      REALTIME_BUS: postgres
      ABUSE_RATE_LIMIT_STORE: postgres
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # The web console: sign-up open on this server (the scenarios sign people up); one address may open the console.
      AUTH_SIGNUP_ENABLED: "true"
      AUTH_ALLOWED_IPS: 203.0.113.7
      # The agent talks to a stand-in for Orazaka's edge (e2e/orazaka-stub.mjs): same contract, no model.
      AI_ENGINE_URL: http://127.0.0.1:4599/edge
      AI_ENGINE_API_KEY: oz_e2e_only_stub_key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Realtime bus contract — PostgreSQL and Valkey, two instances each
        run: npx vitest run apps/web/lib/realtime.integration.test.ts
        env:
          REALTIME_IT: "1"
          REALTIME_REDIS_URL: redis://localhost:6379
      - run: npm run db:seed
      - name: The public landing (the web service serves it from apps/web/public)
        run: npm run build:site && node scripts/sync-site.mjs
      - name: Console test accounts (passwords drawn for this run, never printed)
        run: |
          echo "QA_USER_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=')" >> "$GITHUB_ENV"
          echo "QA_ADMIN_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=')" >> "$GITHUB_ENV"
      - run: npm run db:qa-accounts
      - name: Start the Orazaka stand-in, the API (development server) — and a second one with sign-up closed and no AI
        run: |
          node e2e/orazaka-stub.mjs 4599 > orazaka-stub.log 2>&1 &
          npm run dev > web.log 2>&1 &
          (cd apps/web && AUTH_SIGNUP_ENABLED= AI_ENGINE_URL= AI_ENGINE_API_KEY= NEXT_DIST_DIR=.next-closed NEXT_PUBLIC_APP_URL=http://localhost:3101 npx next dev --port 3101 > ../../web-closed.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf http://localhost:3000/api/healthz && break; sleep 2; done
          for i in $(seq 1 90); do curl -sf http://localhost:3101/api/healthz && break; sleep 2; done
      - name: Scenarios
        run: npm run test:e2e
        env:
          APP_URL: http://localhost:3000
          CLOSED_URL: http://localhost:3101
          ORAZAKA_STUB_URL: http://127.0.0.1:4599
      - if: failure()
        run: tail -200 web.log
