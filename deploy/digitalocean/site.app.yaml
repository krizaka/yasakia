# Yasakia's public dev site — dev.yasakia.com — DigitalOcean App Platform, a STATIC SITE (free tier): no service, no
# database, no secret. Built from apps/site (Next.js `output: "export"`), project "yasakia".
#   doctl apps create --spec deploy/digitalocean/site.app.yaml
#   doctl projects resources assign <PROJECT_ID> --resource do:app:<APP_ID>   # a new app lands in the default project
# The API (deploy/digitalocean/app.yaml, api.yasakia.com) is a different app and is not deployed yet.
name: yasakia-site
region: tor
static_sites:
  - name: site
    github:
      repo: krizaka/yasakia
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm ci && npm run build -w apps/site
    output_dir: apps/site/out
    error_document: 404.html
    routes:
      - path: /
    envs:
      # The short commit shown in the footer next to package.json's version (APP_VERSION, injected at build).
      - key: APP_COMMIT_SHA
        scope: BUILD_TIME
        value: ${_self.COMMIT_HASH}
domains:
  - domain: dev.yasakia.com
    type: PRIMARY
