# dev.yasakia.com — ONE App Platform app (project "yasakia") with two components behind the same domain and certificate:
#   /      the static site  (apps/site, free)
#   /app   the web app      (apps/web: sign-in, home, account, administration console + the API; Next.js basePath /app)
# Why /app and not app.yasakia.com: no new certificate or DNS, the same origin (the session cookie never crosses sites, no
# CORS), the app's pages sit in the product's own address, and the static site stays untouched. The cost is one component:
# a 0.5 GB instance (apps-s-1vcpu-0.5gb, $5/month); the database is a database + role on the shared cluster krizaka-dev-pg.
#   doctl apps update <APP_ID> --spec deploy/digitalocean/dev.app.yaml   # ⚠ SECRET values are entered once in the app
#   (docs/DEPLOYMENT.md, "Dev deployment"): AUTH_SESSION_SECRET, DATABASE_ENCRYPTION_KEY, OPERATOR_API_TOKEN.
# A dev deployment: sign-up closed (AUTH_SIGNUP_ENABLED=false), the console answers one address (AUTH_ALLOWED_IPS), no
# e-mail and no photo storage yet (MAIL_PROVIDER=none, MEDIA_STORAGE_PROVIDER=none: those routes answer 503), and
# accounts exist only through `npm run db:qa-accounts`.
name: yasakia-site
region: tor
domains:
  - domain: dev.yasakia.com
    type: PRIMARY
static_sites:
  - name: site
    github:
      repo: krizaka/yasakia
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm ci && npm run build -w apps/site
    output_dir: apps/site/out
    error_document: 404.html
    routes:
      - path: /
    envs:
      - key: APP_COMMIT_SHA
        scope: BUILD_TIME
        value: ${_self.COMMIT_HASH}
services:
  - name: web
    github:
      repo: krizaka/yasakia
      branch: main
      deploy_on_push: true
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /app/api/healthz
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    routes:
      - path: /app
        preserve_path_prefix: true
    envs:
      - { key: NODE_ENV, value: production }
      - { key: NEXT_PUBLIC_APP_URL, scope: RUN_AND_BUILD_TIME, value: "https://dev.yasakia.com/app" }
      - { key: NEXT_PUBLIC_APP_BASE_PATH, scope: RUN_AND_BUILD_TIME, value: /app }
      - { key: NEXT_PUBLIC_APP_ENV, scope: RUN_AND_BUILD_TIME, value: dev }
      - { key: APP_COMMIT_SHA, scope: BUILD_TIME, value: "${_self.COMMIT_HASH}" }
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${yasakia-db.DATABASE_URL}" }
      - { key: DATABASE_DIRECT_URL, scope: RUN_TIME, value: "${yasakia-db.DATABASE_URL}" }
      - { key: DATABASE_CA_CERT, scope: RUN_TIME, value: "${yasakia-db.CA_CERT}" }
      - { key: DATABASE_MAX_CONNECTIONS, scope: RUN_TIME, value: "4" }
      - { key: AUTH_SESSION_SECRET, scope: RUN_TIME, type: SECRET }
      - { key: DATABASE_ENCRYPTION_KEY, scope: RUN_TIME, type: SECRET }
      - { key: AUTH_SIGNUP_ENABLED, scope: RUN_TIME, value: "false" }
      - { key: AUTH_ALLOWED_IPS, scope: RUN_TIME, value: "142.122.41.109" }
      - { key: MEDIA_STORAGE_PROVIDER, scope: RUN_TIME, value: none }
      - { key: MAIL_PROVIDER, scope: RUN_TIME, value: none }
      - { key: REALTIME_BUS, scope: RUN_TIME, value: postgres }
      - { key: ABUSE_RATE_LIMIT_STORE, scope: RUN_TIME, value: postgres }
      - { key: ABUSE_CLIENT_IP_HEADER, scope: RUN_TIME, value: do-connecting-ip }
jobs:
  # Applies packages/db/drizzle before every release (the bundled migrator, same image). Billed only while it runs.
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: krizaka/yasakia
      branch: main
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    run_command: node migrate.cjs
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${yasakia-db.DATABASE_URL}" }
      - { key: DATABASE_DIRECT_URL, scope: RUN_TIME, value: "${yasakia-db.DATABASE_URL}" }
      - { key: DATABASE_CA_CERT, scope: RUN_TIME, value: "${yasakia-db.CA_CERT}" }
databases:
  # A database and a role on the shared dev cluster (never a second cluster): `doctl databases db create` + `user create`.
  - name: yasakia-db
    engine: PG
    version: "16"
    production: true
    cluster_name: krizaka-dev-pg
    db_name: yasakia_db
    db_user: yasakia_user
