# Yasakia on DigitalOcean — ONE App Platform app (project "yasakia"), one Next.js service:
#   www.yasakia.com     the public landing (apps/site's static export, copied into apps/web/public and served by the service),
#                       the legal pages (/en/privacy…), the person's space (/app/{en|fr}/…) and the API (/api/*)
#   admin.yasakia.com   the administration console (same service, APP_ADMIN_HOST: only the administration exists there)
#   doctl apps update <APP_ID> --spec deploy/digitalocean/web.app.yaml   # SECRET values are entered once, never printed
# History: the first app (`yasakia-site`) was a static-site app; an app created without a service never joined the private
# trusted-source networking (every deployment stalled on DatabaseTrustedSourcesNotReady, even converted in place), so it was
# deleted and this app (`yasakia-dev`) was created as a service. The shared cluster is not a `databases:` component: its private
# connection string and CA are SECRETs, and the app is a trusted source (`doctl databases firewalls append <cluster> --rule app:<app-id>`).
# Cost: one basic-xxs service ($5/month); the `migrate` PRE_DEPLOY job is billed only while it runs.
name: yasakia-dev
region: tor
domains:
  # The public address (epic krizaka/.github#119): www is primary and indexed, the apex answers 308 with www (ingress below).
  - domain: www.yasakia.com
    type: PRIMARY
  - domain: yasakia.com
    type: ALIAS
  # The development address: every page goes to www (308); the API and /.well-known keep serving, noindex (APP_DEV_HOST).
  - domain: dev.yasakia.com
    type: ALIAS
  - domain: admin.yasakia.com
    type: ALIAS
# The apex leads to www (308); the other hosts are the app's (dev's page redirect and noindex are the app's own: lib/indexing.ts).
ingress:
  rules:
    - match:
        authority:
          exact: yasakia.com
      redirect:
        authority: www.yasakia.com
        redirect_code: 308
    - match:
        path:
          prefix: /
      component:
        name: web
services:
  - name: web
    github: { repo: krizaka/yasakia, branch: main, deploy_on_push: true }
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check: { http_path: /api/healthz, initial_delay_seconds: 20, period_seconds: 10, timeout_seconds: 5, failure_threshold: 3 }
    envs:
      - { key: NODE_ENV, value: production }
      - { key: NEXT_PUBLIC_APP_URL, scope: RUN_AND_BUILD_TIME, value: "https://www.yasakia.com" }
      - { key: APP_DEV_HOST, scope: RUN_TIME, value: dev.yasakia.com }
      - { key: NEXT_PUBLIC_APP_ENV, scope: RUN_AND_BUILD_TIME, value: dev }
      # www is indexed (krizaka-com AGENTS §2.4): robots allows, sitemap, no noindex. dev. and admin. are closed by host (lib/indexing.ts).
      - { key: APP_SEARCH_INDEXING, scope: RUN_AND_BUILD_TIME, value: "on" }
      - { key: APP_COMMIT_SHA, scope: BUILD_TIME, value: "${_self.COMMIT_HASH}" }
      - { key: APP_ADMIN_HOST, scope: RUN_TIME, value: admin.yasakia.com }
      - { key: DATABASE_URL, scope: RUN_TIME, type: SECRET }
      - { key: DATABASE_DIRECT_URL, scope: RUN_TIME, type: SECRET }
      - { key: DATABASE_CA_CERT, scope: RUN_TIME, type: SECRET }
      - { key: DATABASE_MAX_CONNECTIONS, scope: RUN_TIME, value: "2" }
      - { key: AUTH_SESSION_SECRET, scope: RUN_TIME, type: SECRET }
      - { key: DATABASE_ENCRYPTION_KEY, scope: RUN_TIME, type: SECRET }
      - { key: AUTH_SIGNUP_ENABLED, scope: RUN_TIME, value: "false" }
      - { key: AUTH_ALLOWED_IPS, scope: RUN_TIME, value: "142.122.41.109" }
      # Photos: Yasakia's own private Bunny storage zone + pull zone (token authentication, signed URLs of 300 s), both `yasakia-dev`.
      - { key: MEDIA_STORAGE_PROVIDER, scope: RUN_TIME, value: bunny }
      - { key: MEDIA_STORAGE_ZONE, scope: RUN_TIME, value: yasakia-dev }
      - { key: MEDIA_STORAGE_ENDPOINT, scope: RUN_TIME, value: ny.storage.bunnycdn.com }
      - { key: MEDIA_CDN_HOSTNAME, scope: RUN_AND_BUILD_TIME, value: yasakia-dev.b-cdn.net }
      - { key: MEDIA_STORAGE_API_KEY, scope: RUN_TIME, type: SECRET }
      - { key: MEDIA_CDN_TOKEN_AUTH_KEY, scope: RUN_TIME, type: SECRET }
      - { key: MAIL_PROVIDER, scope: RUN_TIME, value: none }
      - { key: REALTIME_BUS, scope: RUN_TIME, value: postgres }
      - { key: ABUSE_RATE_LIMIT_STORE, scope: RUN_TIME, value: postgres }
      - { key: ABUSE_CLIENT_IP_HEADER, scope: RUN_TIME, value: do-connecting-ip }
      # The agent runs on Orazaka's dev edge with Yasakia's service key (svc_yasakia, a SECRET set with `doctl apps update`, never printed).
      - { key: AI_ENGINE_URL, scope: RUN_TIME, value: "https://dev.orazaka.com/edge" }
      - { key: AI_ENGINE_API_KEY, scope: RUN_TIME, type: SECRET }
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github: { repo: krizaka/yasakia, branch: main }
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    run_command: node migrate.cjs
    instance_size_slug: basic-xxs
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, type: SECRET }
      - { key: DATABASE_DIRECT_URL, scope: RUN_TIME, type: SECRET }
      - { key: DATABASE_CA_CERT, scope: RUN_TIME, type: SECRET }
