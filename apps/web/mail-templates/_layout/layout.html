<!DOCTYPE html>
<html lang="{lang}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{subject}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;-webkit-text-size-adjust:100%;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f4f5" style="background-color:#f4f4f5;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
        <tr>
          <td bgcolor="#09090b" style="background-color:#09090b;border-radius:16px 16px 0 0;padding:24px 32px;">
            <a href="{appUrl}" style="font-family:'Outfit',Helvetica,Arial,sans-serif;font-size:22px;font-weight:700;letter-spacing:0.5px;color:#fafafa;text-decoration:none;">Yasakia</a>
          </td>
        </tr>
        <tr>
          <td height="4" bgcolor="#14b8a6" style="height:4px;line-height:4px;font-size:4px;background-color:#14b8a6;background-image:linear-gradient(90deg,#10b981,#14b8a6);">&nbsp;</td>
        </tr>
        <tr>
          <td bgcolor="#ffffff" style="background-color:#ffffff;padding:32px;font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#18181b;">
{content}
          </td>
        </tr>
        <tr>
          <td bgcolor="#ffffff" style="background-color:#ffffff;border-top:1px solid #e4e4e7;border-radius:0 0 16px 16px;padding:20px 32px;font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#71717a;">
            {footer}<br>
            &copy; {year} Yasakia · Krizaka
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
